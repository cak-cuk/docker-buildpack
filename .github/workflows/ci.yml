---
name: CI/CD
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.sh'
  schedule:
    - cron: '0 12 * * 0'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    name: Code check
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu1804, ubuntu2004, ubuntu2204, ubuntu2404, ubuntu2604, debian11, debian12, debian13, almalinux9, almalinux10, rockylinux9, rockylinux10, alpine-edge, alpine-latest ]
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.os }}/Dockerfile
          config: .hadolint.yaml

  build_container:
    name: Build container
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu1804, ubuntu2004, ubuntu2204, ubuntu2404, ubuntu2604, debian11, debian12, debian13, almalinux9, almalinux10, rockylinux9, rockylinux10, alpine-edge, alpine-latest ]
        include:
          - os: alpine-latest
            codename: alpine-3
          - os: ubuntu1804
            codename: ubuntu-bionic
          - os: ubuntu2004
            codename: ubuntu-focal
          - os: ubuntu2204
            codename: ubuntu-jammy
          - os: ubuntu2404
            codename: ubuntu-noble
          - os: ubuntu2604
            codename: ubuntu-resolute
          - os: debian11
            codename: debian-bullseye
          - os: debian12
            codename: debian-bookworm
          - os: debian13
            codename: debian-trixie
    steps:
      - name: Checkout the codebase
        uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image.
        if: ${{ matrix.codename !='' }}
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ${{ matrix.os }}/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: udienz/buildpack:${{ matrix.os }},udienz/buildpack:${{ matrix.codename }}

      - name: Build and push image.
        if: ${{ matrix.codename =='' }}
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ${{ matrix.os }}/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: udienz/buildpack:${{ matrix.os }}
